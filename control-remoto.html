<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizFree - Control Remoto</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 24px;
  min-height: 100vh;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

.control {
  width: 100%;
  max-width: 380px;
  text-align: center;
  background: #1e293b;
  padding: 25px;
  border-radius: 22px;
}

h1 {
  margin-top: 0;
  color: #60a5fa;
}

#status {
  color: #fbbf24;
  font-size: 14px;
  margin: 18px 0;
}

#status.connected {
  color: #4ade80;
}

button, input {
  width: 100%;
  padding: 16px;
  margin: 7px 0;
  border: 0;
  border-radius: 12px;
  font-size: 16px;
}

button {
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(.98);
}

.secundario {
  background: #334155;
}

input {
  background: #0f172a;
  color: white;
  border: 1px solid #475569;
  text-align: center;
}

p {
  color: #94a3b8;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="control">
  <h1>🎮 QuizFree</h1>
  <h3>Control de presentación</h3>

  <div id="status">Conectando...</div>

  <button id="btn-prev" class="secundario">
    ◀ Anterior
  </button>

  <button id="btn-next">
    Siguiente ▶
  </button>

  <hr style="border-color:#334155;margin:22px 0">

  <input
    id="slide-num"
    type="number"
    min="1"
    placeholder="Número de diapositiva"
  >

  <button id="btn-goto" class="secundario">
    Ir a diapositiva
  </button>

  <p>Mantén abierta la presentación en otra pestaña.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>

<script>
(() => {
  const ROOM_ID = 'recocido-slides-2026';

  const status = document.getElementById('status');
  let peer = null;
  let conn = null;
  let retryTimer = null;
  let stopped = false;

  function showStatus(message, connected = false) {
    status.textContent = message;
    status.className = connected ? 'connected' : '';
  }

  function connect() {
    if (stopped || peer) return;

    showStatus('Conectando con la presentación...');

    const p = new Peer();
    peer = p;

    p.on('open', () => {
      if (peer !== p || stopped) return;

      const c = p.connect(ROOM_ID, { reliable: true });
      conn = c;

      c.on('open', () => {
        if (conn !== c) return;
        showStatus('✓ ¡Conectado!', true);
      });

      c.on('data', msg => {
        if (msg && msg.type === 'ready') {
          showStatus('✓ Presentación lista', true);
        }
      });

      c.on('close', () => {
        if (conn !== c) return;
        conn = null;
        reconnect();
      });

      c.on('error', () => {
        if (conn !== c) return;
        conn = null;
        reconnect();
      });
    });

    p.on('error', err => {
      if (peer !== p) return;

      console.log('PeerJS:', err.type);

      if (err.type === 'peer-unavailable') {
        showStatus('Abre primero la presentación...');
      } else {
        showStatus('Reconectando...');
      }

      peer = null;
      try { p.destroy(); } catch (e) {}
      reconnect();
    });
  }

  function reconnect() {
    if (stopped || retryTimer) return;

    showStatus('Desconectado. Reintentando...');

    retryTimer = setTimeout(() => {
      retryTimer = null;
      peer = null;
      connect();
    }, 3000);
  }

  function send(type, extra = {}) {
    if (!conn || !conn.open) {
      showStatus('Espera a que se conecte...');
      return;
    }

    conn.send({ type, ...extra });
  }

  document.getElementById('btn-next').onclick =
    () => send('next');

  document.getElementById('btn-prev').onclick =
    () => send('prev');

  document.getElementById('btn-goto').onclick = () => {
    const num = Number(
      document.getElementById('slide-num').value
    );

    if (!Number.isInteger(num) || num < 1) {
      showStatus('Escribe un número válido.');
      return;
    }

    send('goto', { slide: num });
  };

  window.addEventListener('pagehide', () => {
    stopped = true;
    if (retryTimer) clearTimeout(retryTimer);
    if (peer && !peer.destroyed) peer.destroy();
  });

  connect();
})();
</script>

</body>
</html>
