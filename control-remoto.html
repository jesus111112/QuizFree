<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
  const ROOM_ID = 'recocido-slides-2026';
  const status = document.getElementById('status');
  let conn = null;
  let peer = null;

  function connect() {
    status.textContent = 'Conectando…';
    status.className = 'status waiting';

    if (peer) {
      try { peer.destroy(); } catch(e) {}
    }

    peer = new Peer();

    peer.on('open', () => {
      conn = peer.connect(ROOM_ID, { reliable: true });

      conn.on('open', () => {
        status.textContent = '✓ Conectado';
        status.className = 'status connected';
      });

      conn.on('close', () => {
        status.textContent = 'Desconectado – reintentando…';
        status.className = 'status waiting';
        setTimeout(connect, 2000);
      });
    });

    peer.on('error', err => {
      console.warn(err);
      status.textContent = 'Error: ' + err.type + ' – reintentando…';
      status.className = 'status waiting';
      setTimeout(connect, 2500);
    });
  }

  connect();

  function send(type, extra = {}) {
    if (conn && conn.open) {
      conn.send({ type, ...extra });
    } else {
      alert('Todavía no está conectado. Espera un momento.');
    }
  }

  document.getElementById('btn-next').onclick = () => send('next');
  document.getElementById('btn-prev').onclick = () => send('prev');
  document.getElementById('btn-goto').onclick = () => {
    const num = document.getElementById('slide-num').value;
    if (num) send('goto', { slide: num });
  };
})();
</script>
