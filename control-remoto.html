<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Control remoto – Recocido</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,sans-serif;
    background:#1b1a2e;
    color:#f6f1ea;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 16px;
  }
  h1{font-size:1.4rem;margin-bottom:8px;text-align:center}
  .status{font-size:.9rem;opacity:.7;margin-bottom:20px;text-align:center}
  #qr{background:#fff;padding:12px;border-radius:12px;margin-bottom:24px}
  .btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:320px}
  button{
    font-size:1.3rem;
    font-weight:700;
    padding:18px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    color:#1b1a2e;
  }
  .next{background:#e4572e}
  .prev{background:#f08a5d}
  .goto{background:#4a90d9;color:#fff}
  input{
    font-size:1.2rem;
    padding:12px;
    border-radius:10px;
    border:none;
    text-align:center;
    width:100%;
    margin-bottom:8px;
  }
  .row{display:flex;gap:10px}
  .row button{flex:1}
  .connected{color:#4ade80}
  .waiting{color:#fbbf24}
</style>
</head>
<body>
  <h1>Control Remoto</h1>
  <p class="status" id="status">Conectando…</p>

  <div id="qr"></div>

  <div class="btns">
    <button class="prev" id="btn-prev">← Anterior</button>
    <button class="next" id="btn-next">Siguiente →</button>

    <div style="margin-top:10px">
      <input type="number" id="slide-num" placeholder="Nº diapositiva" min="1">
      <button class="goto" id="btn-goto">Ir a diapositiva</button>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  // Debe ser el mismo ID que pusiste en la presentación
  const ROOM_ID = 'recocido-slides-2026';

  const status = document.getElementById('status');
  let conn = null;

  // Generar QR que apunta a este mismo control (opcional)
  // En realidad el QR no es necesario si abres el archivo directo en el celular,
  // pero lo dejamos por si quieres compartirlo.
  const url = location.href;
  new QRCode(document.getElementById('qr'), {
    text: url,
    width: 180,
    height: 180
  });

  const peer = new Peer();

  peer.on('open', () => {
    status.textContent = 'Conectando con la presentación…';
    status.className = 'status waiting';

    conn = peer.connect(ROOM_ID, { reliable: true });

    conn.on('open', () => {
      status.textContent = '✓ Conectado – ya puedes controlar';
      status.className = 'status connected';
    });

    conn.on('close', () => {
      status.textContent = 'Desconectado';
      status.className = 'status waiting';
    });
  });

  peer.on('error', err => {
    status.textContent = 'Error: ' + err.type;
  });

  function send(type, extra = {}) {
    if (conn && conn.open) {
      conn.send({ type, ...extra });
    } else {
      alert('Aún no está conectado a la presentación');
    }
  }

  document.getElementById('btn-next').onclick = () => send('next');
  document.getElementById('btn-prev').onclick = () => send('prev');
  document.getElementById('btn-goto').onclick = () => {
    const num = document.getElementById('slide-num').value;
    if (num) send('goto', { slide: num });
  };
})();
</script>
</body>
</html>
