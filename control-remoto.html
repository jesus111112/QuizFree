<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Control remoto</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; gap: 12px; padding: 16px;
    background: #0f172a; color: #f1f5f9;
    font-family: system-ui, -apple-system, sans-serif;
    user-select: none; touch-action: manipulation;
  }
  h1 { font-size: 18px; margin: 0; text-align: center; }
  #status {
    text-align: center; font-weight: 600; font-size: 14px;
    padding: 8px; border-radius: 8px; background: #1e293b; color: #facc15;
  }
  #status.ok { color: #4ade80; }
  #status.err { color: #f87171; }
  .pad { flex: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  button {
    border: 0; border-radius: 16px; font-weight: 700; color: #fff;
    background: #334155; cursor: pointer; font-family: inherit;
  }
  button:active { transform: scale(.97); filter: brightness(1.2); }
  button:disabled { opacity: .4; }
  #next { flex: 2; font-size: 28px; background: #2563eb; }
  #prev { flex: 1; font-size: 22px; }
  .goto { display: flex; gap: 8px; }
  .goto input {
    flex: 1; min-width: 0; padding: 12px; font-size: 18px; text-align: center;
    border-radius: 12px; border: 1px solid #475569; background: #1e293b; color: #fff;
  }
  .goto button { padding: 0 20px; font-size: 16px; }
</style>
</head>
<body>
  <h1>📱 Control remoto</h1>
  <div id="status">Conectando…</div>

  <div class="pad">
    <button id="next" disabled>Siguiente ▶</button>
    <button id="prev" disabled>◀ Anterior</button>
  </div>

  <div class="goto">
    <input id="slide" type="number" inputmode="numeric" min="1" placeholder="N.º de diapositiva">
    <button id="go" disabled>Ir</button>
  </div>

<script>
(function () {
  'use strict';

  const params = new URLSearchParams(location.search);
  const ROOM_ID = params.get('room');

  const statusEl = document.getElementById('status');
  const btns = ['next', 'prev', 'go'].map(id => document.getElementById(id));
  let peer = null, conn = null, retryTimer = null;

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  }
  function setEnabled(on) { btns.forEach(b => b.disabled = !on); }

  function send(msg) {
    if (conn && conn.open) {
      conn.send(msg);
      if (navigator.vibrate) navigator.vibrate(15);
    }
  }

  function connect() {
    clearTimeout(retryTimer);
    if (!peer || peer.destroyed) return;
    setStatus('Conectando a la presentación…');
    conn = peer.connect(ROOM_ID, { reliable: true });

    conn.on('open', function () {
      setStatus('✔ Conectado', 'ok');
      setEnabled(true);
    });
    conn.on('data', function (msg) {
      if (msg && msg.type === 'ready') setStatus('✔ Conectado', 'ok');
    });
    conn.on('close', function () {
      setEnabled(false);
      setStatus('Conexión perdida. Reintentando…', 'err');
      retryTimer = setTimeout(connect, 2000);
    });
    conn.on('error', function () {
      setEnabled(false);
      retryTimer = setTimeout(connect, 2000);
    });
  }

  function init() {
    if (!ROOM_ID) {
      setStatus('Falta el código de sala. Escanea el QR de la presentación.', 'err');
      return;
    }
    if (!window.Peer) {
      setStatus('No se pudo cargar PeerJS.', 'err');
      return;
    }
    peer = new Peer();
    peer.on('open', connect);
    peer.on('disconnected', function () { if (!peer.destroyed) peer.reconnect(); });
    peer.on('error', function (err) {
      if (err.type === 'peer-unavailable') {
        setEnabled(false);
        setStatus('Presentación no encontrada. ¿Está abierta? Reintentando…', 'err');
        retryTimer = setTimeout(connect, 2500);
      } else {
        setStatus('Error: ' + err.type, 'err');
      }
    });
  }

  document.getElementById('next').addEventListener('click', () => send({ type: 'next' }));
  document.getElementById('prev').addEventListener('click', () => send({ type: 'prev' }));
  document.getElementById('go').addEventListener('click', function () {
    const n = parseInt(document.getElementById('slide').value, 10);
    if (Number.isInteger(n) && n >= 1) send({ type: 'goto', slide: n });
  });

  // Mantener la pantalla encendida mientras se usa el control
  async function keepAwake() {
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {}
  }
  keepAwake();
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      keepAwake();
      if (!conn || !conn.open) connect();
    }
  });

  init();
})();
</script>
</body>
</html>
